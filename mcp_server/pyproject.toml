[project]
name = "maliaras-parent-mcp"
version = "0.1.0"
description = "Private, read-only Maliaras parent MCP server"
requires-python = ">=3.12"
dependencies = ["fastmcp>=3,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
asyncio_mode = "auto"
